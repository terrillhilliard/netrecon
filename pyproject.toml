[project]
name = "netrecon"
version = "0.9.0"
description = "Network reconnaissance, asset inventory & monitoring CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Terrill Hilliard" }]
keywords = ["security", "network", "recon", "port-scanner", "asset-inventory", "blue-team"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3",
]
# The core runs on the Python standard library alone. These add polished output,
# MAC-vendor names, and ARP-spoof MITM (scapy). Install them all with `pip install -e .`.
dependencies = [
    "rich>=13",                  # colored tables / console output
    "mac-vendor-lookup>=0.1.12", # OUI -> vendor names
    "scapy>=2.5",                # ARP-spoof MITM (needs Npcap on Windows / libpcap on *nix)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
netrecon = "netrecon.cli:main"

[project.urls]
Homepage = "https://github.com/terrillhilliard/netrecon"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netrecon*"]
